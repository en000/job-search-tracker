spring.application.name=job-search-tracker
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/${POSTGRES_DB:jobtracker}
spring.datasource.username=${POSTGRES_USER:jobtracker}
spring.datasource.password=${POSTGRES_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.mapping-resources=META-INF/tracker-orm.xml
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-numbers-for-enums=true
spring.jackson.mapper.allow-coercion-of-scalars=false
spring.mvc.problemdetails.enabled=true
server.forward-headers-strategy=none
tracker.allowed-authorities=localhost:8080,127.0.0.1:8080

spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.deserialization.fail-on-trailing-tokens=true
spring.jackson.parser.strict-duplicate-detection=true
